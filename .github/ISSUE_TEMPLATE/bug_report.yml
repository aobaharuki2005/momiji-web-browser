name: Bug Report
description: File a bug report of Momiji
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for filing a bug report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: checkboxes
    id: firefox
    attributes:
      label: Reproducible?
      description: Is this issue reproducible on upstream Firefox?
      options:
        - label: I have checked that this issue cannot be reproduced on upstream Mozilla Firefox (running on macOS 10.15 and later).
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of our software are you running?
      placeholder: e.g., 140.0.1esr-mj
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Which macOS version are you using?
      multiple: true
      options:
        - 10.7 (Lion)
        - 10.8 (Mountain Lion)
        - 10.9 (Mavericks)
        - 10.10 (Yosemite)
        - 10.11 (El Capitan)
        - 10.12 (Sierra)
        - 10.13 (High Sierra)
        - 10.14 (Mojave)
    validations:
      required: true