name: testing build for macOS 10.19-10.14

on:
  push:
    branches:
      - '*test'
    paths-ignore:
      # - '.github/workflows/*.yml'
      # - 'mozconf*'
      - '*.md'

jobs:
  build:
    name: build Momiji
    runs-on: macos-15-intel
    steps:     
      - name: Checkout source code
        id: checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          submodules: recursive

      # Khôi phục cache của sccache từ các lần build trước
      - name: Restore sccache cache mozbuild toolchains
        id: restore-cache
        uses: actions/cache/restore@v5.0.4
        with:
          path: | 
            ~/Library/Caches/Mozilla.sccache 
            ~/.mozbuild
          key: ${{ runner.os }}-${{ hashFiles('mozconfig-cicd.sh') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('mozconfig-cicd.sh') }}
            ${{ runner.os }}-

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Bootstrapping build deps
        id: bootstrap
        run: |
          if [ ! -d "$HOME/.mozbuild" ]; then
            echo "Cached .mozbuild toolchain not found. Starting bootstrap..."
            /usr/bin/python3 ./mach bootstrap --application-choice=browser
        
            # Tạo thư mục tạm để lưu các toolchain quan trọng
            mkdir -p ~/tmp_toolchains
            
            # Di chuyển các thư mục cần thiết ra ngoài (dùng -f để tránh hỏi)
            [ -d "$HOME/.mozbuild/node" ] && mv "$HOME/.mozbuild/node" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/sccache" ] && mv "$HOME/.mozbuild/sccache" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/cbindgen" ] && mv "$HOME/.mozbuild/cbindgen" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/nasm" ] && mv "$HOME/.mozbuild/nasm" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/dump_syms" ] && mv "$HOME/.mozbuild/dump_syms" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/clang" ] && mv "$HOME/.mozbuild/clang" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/sysroot-wasm32-wasi" ] && mv "$HOME/.mozbuild/sysroot-wasm32-wasi" ~/tmp_toolchains/
            
            # Xóa sạch toàn bộ thư mục .mozbuild cũ (vốn chứa nhiều rác)
            rm -rf "$HOME/.mozbuild"
        
            # Đổi tên thư mục tạm thành .mozbuild
            mv ~/tmp_toolchains "$HOME/.mozbuild"
            
            echo "Bootstrap finished. Kept: nodejs, sccache, cbindgen, nasm, dump_syms, clang, sysroot-wasm32-wasi"
          fi

      - name: Create mozconfig build config from template
        id: buildcfg-link
        run: ln -sf ./mozconfig-cicd_1009-1014.sh mozconfig

      # - name: Manually configure Rust toolchain
      #   id: rust-cfg
      #   run: |
      #     if [ ! -d "$HOME/.rustup/toolchains/1.91.0-custom" ]; then
      #       echo "Cached Rust 1.91.0-custom not found. Starting bootstrap..."
      #       curl -L https://github.com/aobaharuki2005/rust/releases/download/v1.91.0-custom-redist/1.91.0-custom.tar.gz -o 1.91.0-custom.tar.gz
      #       mkdir -p ~/.rustup/toolchains
      #       tar -xf ./1.91.0-custom.tar.gz -C ~/.rustup/toolchains
      #       echo "Bootstrap Rust 1.91.0-custom finished."
      #     fi
        
      #     # Change default Rust toolchain
      #     rustup default 1.91.0-custom
      #     rustup override set 1.91.0-custom
      
      - name: Configure Rust toolchain version 1.82.0-nightly (nightly-2024-07-25)
        id: rust-1820-nightly-cfg
        run: |
          rustup install nightly-2024-07-25
          rustup default nightly-2024-07-25
          rustup override set nightly-2024-07-25

          # Verify Rust installation
          cargo --version
          rustc --version
          
      - name: Configure build options
        id: configure
        run: | 
          # Khởi động sccache trước khi build
          $HOME/.mozbuild/sccache/sccache --start-server
          /usr/bin/python3 ./mach configure

      - name: Build
        id: build
        run: /usr/bin/python3 ./mach build

      - name: Show sccache stats
        id: show-sccache-stats
        run: $HOME/.mozbuild/sccache/sccache --show-stats

      - name: Package
        id: pkg
        run: /usr/bin/python3 ./mach package

      # path to built app: obj-ff-dbg-esr/dist/*.dmg
      - name: Polyfill Momiji with MacPorts Legacy Support in libgkcodecs.dylib
        id: macports-legacy-polyfill
        run: |
          # Copy Momiji.app to /tmp
          hdiutil attach obj-ff-dbg-esr/dist/momiji-140.3.0esr-mj.en-US.mac.dmg
          cp -R /Volumes/Momiji/Momiji.app /tmp
          
          # Build libMacportsLegacySystem.B.dylib
          git clone --recursive --branch v1.5.2 https://github.com/macports/macports-legacy-support.git
          cd macports-legacy-support
          MACOSX_DEPLOYMENT_TARGET=10.9 make

          # copy libMacportsLegacySystem.B.dylib to the Frameworks directory of Momiji.app
          cp lib/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/

          # Polyfill *.dylib, momiji, nmhproxy, pingsender and XUL binaries
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/pingsender       
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/libfreebl3.dylib 
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/liblgpllibs.dylib
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/nmhproxy
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/libsoftokn3.dylib
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/XUL
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/libmozavutil.dylib
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/libmozglue.dylib
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/libgkcodecs.dylib
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/libmozavcodec.dylib
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/momiji
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/libnss3.dylib

          # Polyfill plugin-container.app and media-plugin-helper.app
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib "/tmp/Momiji.app/Contents/MacOS/media-plugin-helper.app/Contents/MacOS/Momiji Media Plugin Helper"
          install_name_tool -change /usr/lib/libSystem.B.dylib /tmp/Momiji.app/Contents/Frameworks/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS/plugin-container.app/Contents/MacOS/plugin-container

          # Archive the output app
          cd /tmp
          zip -r momiji-140.3.0esr-mj_macOS10.9-10.14.zip Momiji.app

      - name: Stop sccache
        run: $HOME/.mozbuild/sccache/sccache --stop-server

      - name: Saving cache in case building, packaging or polyfill fails
        id: save-cache-incase-fail
        if: |
          steps.build.outcome == failure() || 
          steps.pkg.outcome == failure() || 
          steps.macports-legacy-polyfill.outcome == failure()
        uses: actions/cache/save@v5.0.4
        with:
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
          path: |
            ~/Library/Caches/Mozilla.sccache 
            ~/.mozbuild
      
      - name: Saving cache in normal cases
        id: save-cache-incase-normal
        uses: actions/cache/save@v5.0.4
        with:
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
          path: |
            ~/Library/Caches/Mozilla.sccache 
            ~/.mozbuild

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          archive: false
          path: momiji-140.3.0esr-mj_macOS10.9-10.14.zip
          if-no-files-found: error
          retention-days: 7
    
