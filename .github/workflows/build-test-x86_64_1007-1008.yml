name: build for macOS 10.7-10.8

on:
  # pull_request: 
  #   branches: master
  push:
    branches:
      - '*test'
    paths-ignore:
      - '*1009-1014*'
      - '.github/workflows/*1009-1014.yml'
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    name: build Momiji
    runs-on: macos-15-intel
    steps:     
      - name: Checkout source code
        id: checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          submodules: recursive

      # Khôi phục cache của sccache từ các lần build trước
      - name: Restore sccache cache mozbuild toolchains
        id: restore-cache
        uses: actions/cache/restore@v5.0.4
        with:
          path: | 
            ~/Library/Caches/Mozilla.sccache 
            ~/.mozbuild
          key: ${{ runner.os }}-ld64-${{ hashFiles('mozconfig-cicd.sh') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ld64-${{ hashFiles('mozconfig-cicd.sh') }}
            ${{ runner.os }}-ld64

      - name: Select Xcode 16.3 (SDK 15.4)
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Bootstrapping build deps
        id: bootstrap
        run: |
          if [ ! -d "$HOME/.mozbuild" ]; then
            echo "Cached .mozbuild toolchain not found. Starting bootstrap..."
            /usr/bin/python3 ./mach bootstrap --application-choice=browser
        
            # Tạo thư mục tạm để lưu các toolchain quan trọng
            mkdir -p ~/tmp_toolchains
            
            # Di chuyển các thư mục cần thiết ra ngoài (dùng -f để tránh hỏi)
            [ -d "$HOME/.mozbuild/node" ] && mv "$HOME/.mozbuild/node" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/sccache" ] && mv "$HOME/.mozbuild/sccache" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/cbindgen" ] && mv "$HOME/.mozbuild/cbindgen" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/nasm" ] && mv "$HOME/.mozbuild/nasm" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/dump_syms" ] && mv "$HOME/.mozbuild/dump_syms" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/clang" ] && mv "$HOME/.mozbuild/clang" ~/tmp_toolchains/
            [ -d "$HOME/.mozbuild/sysroot-wasm32-wasi" ] && mv "$HOME/.mozbuild/sysroot-wasm32-wasi" ~/tmp_toolchains/
            
            # Xóa sạch toàn bộ thư mục .mozbuild cũ (vốn chứa nhiều rác)
            rm -rf "$HOME/.mozbuild"
        
            # Đổi tên thư mục tạm thành .mozbuild
            mv ~/tmp_toolchains "$HOME/.mozbuild"
            
            echo "Bootstrap finished. Kept: nodejs, sccache, cbindgen, nasm, dump_syms, clang, sysroot-wasm32-wasi"
          fi

      - name: Create mozconfig build config from template
        id: buildcfg-link
        run: ln -sf ./mozconfig-cicd_1007-1008.sh mozconfig

      # - name: Manually configure Rust toolchain
      #   id: rust-cfg
      #   run: |
      #     if [ ! -d "$HOME/.rustup/toolchains/1.86.0-custom" ]; then
      #       echo "Cached Rust 1.86.0-custom not found. Starting bootstrap..."
      #       curl -L https://github.com/aobaharuki2005/rust/releases/download/v1.86.0-custom/1.86.0-custom.tar.gz -o 1.86.0-custom.tar.gz
      #       mkdir -p ~/.rustup/toolchains
      #       tar -xf ./1.86.0-custom.tar.gz -C ~/.rustup/toolchains
      #       echo "Bootstrap Rust 1.86.0-custom finished."
      #     fi
        
      #     # Change default Rust toolchain
      #     rustup default 1.86.0-custom
      #     rustup override set 1.86.0-custom
      
      #     # Verify Rust installation
      #     cargo --version
      #     rustc --version
      
      - name: Configure Rust toolchain version 1.86.0-nightly (nightly-2025-01-09)
        id: rust-1850-nightly-cfg
        run: |
          rustup install nightly-2025-01-09
          rustup default nightly-2025-01-09
          rustup override set nightly-2025-01-09

          # Verify Rust installation
          cargo --version
          rustc --version

      - name: Configure build options
        id: configure
        run: | 
          # Khởi động sccache trước khi build
          $HOME/.mozbuild/sccache/sccache --start-server
          /usr/bin/python3 ./mach configure

      - name: Build
        id: build
        run: /usr/bin/python3 ./mach build

      - name: Show sccache stats
        id: show-sccache-stats
        run: $HOME/.mozbuild/sccache/sccache --show-stats

      - name: Package
        id: pkg
        run: /usr/bin/python3 ./mach package

      # path to built app: obj-ff-dbg-esr/dist/*.dmg
      - name: Polyfill Momiji with MacPorts Legacy Support
        id: macports-legacy-polyfill
        run: |
          # Get the current Momiji version
          export VERSION=$(cat browser/config/version.txt)
          
          # Copy Momiji.app to /tmp
          hdiutil attach "obj-ff-dbg-esr/dist/momiji-${VERSION}.en-US.mac.dmg"
          cp -R /Volumes/Momiji/Momiji.app /tmp
          
          # Build libMacportsLegacySystem.B.dylib (patched to support CCRandomGenerateBytes and exp10)
          git clone --recursive --branch 1.5.2_addCCRandom https://github.com/aobaharuki2005/macports-legacy-support.git
          cd macports-legacy-support
          MACOSX_DEPLOYMENT_TARGET=10.6 make

          # copy libMacportsLegacySystem.B.dylib to the Frameworks directory of Momiji.app
          cp lib/libMacportsLegacySystem.B.dylib /tmp/Momiji.app/Contents/MacOS

          # Polyfill XUL, libmozavutil.dylib and libgkcodecs.dylib only
          cd /tmp/Momiji.app/Contents/MacOS/
          install_name_tool -change "/usr/lib/libSystem.B.dylib" "@executable_path/libMacportsLegacySystem.B.dylib" "XUL"
          install_name_tool -change "/usr/lib/libSystem.B.dylib" "@executable_path/libMacportsLegacySystem.B.dylib" "libmozavutil.dylib"
          install_name_tool -change "/usr/lib/libSystem.B.dylib" "@executable_path/libMacportsLegacySystem.B.dylib" "libgkcodecs.dylib"

          # Archive the output app
          cd /tmp
          zip -r "momiji-${VERSION}_macOS10.7-10.8.zip" Momiji.app

      - name: Stop sccache and create the cache folder in case it didn not exist yet
        if: always()
        run: |
          [ ! -d ~/Library/Caches/Mozilla.sccache ] && mkdir -p ~/Library/Caches/Mozilla.sccache 
          $HOME/.mozbuild/sccache/sccache --stop-server
          # Delay for 60s to fix "file changes as we read it" from save-cache task
          sleep 60
          echo "60s of waiting has ended."

      # (No need to save cache in production build session)
      - name: Saving cache even if pipeline fails
        id: save-cache
        if: always()
        uses: actions/cache/save@v5.0.4
        with:
          key: ${{ runner.os }}-ld64-${{ hashFiles('mozconfig-cicd.sh') }}-${{ github.run_id }}
          path: |
            ~/Library/Caches/Mozilla.sccache 
            ~/.mozbuild

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          archive: true
          path: | 
            /tmp/*.zip
            obj-ff-dbg-esr/dist/momiji-*.en-US.mac.dmg
          if-no-files-found: error
          retention-days: 7
    
